services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: clintrialsync
      POSTGRES_USER: clintrial
      POSTGRES_PASSWORD: clintrial_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clintrial -d clintrialsync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: